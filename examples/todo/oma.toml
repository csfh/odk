# `odk oma dev examples/todo`: build Todo, sign its Bundle with this computer's dev key, install it
# over the installed copy and run it (ADR 0051, ADR 0073, ADR 0085). Not part of the Bundle. Paths
# are from this directory.
build = [
  ["cargo", "build", "--release", "--locked", "-p", "todo"],
  # The licences of what Todo is made of, which the Bundle carries (ADR 0081).
  ["../../tools/third-party-licenses", "../../Cargo.toml", "../../target/release/THIRD-PARTY-LICENSES-todo", "todo"],
]
executable = "../../target/release/todo"
include = [
  "../../LICENSE=share/licenses/LICENSE",
  "../../target/release/THIRD-PARTY-LICENSES-todo=share/licenses/THIRD-PARTY-LICENSES",
]
