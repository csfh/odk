[package]
name = "todo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
deps.workspace = true
odk = { workspace = true, features = ["db"] }

[dev-dependencies]
# The view's tests run on GPUI's test platform; nothing opens a window.
# `db` is repeated so a test build keeps the database the library uses.
odk = { workspace = true, features = ["db", "test-support"] }
tempfile = "3"
