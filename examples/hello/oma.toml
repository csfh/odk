# `odk oma dev examples/hello`: build Hello, sign its Bundle with this computer's dev key, install it
# over the installed copy and run it (ADR 0051, ADR 0073, ADR 0085). Not part of the Bundle. Paths
# are from this directory.
build = [
  ["cargo", "build", "--release", "--locked", "-p", "hello"],
  # The licences of what Hello is made of, which the Bundle carries (ADR 0081).
  ["../../tools/third-party-licenses", "../../Cargo.toml", "../../target/release/THIRD-PARTY-LICENSES-hello", "hello"],
]
executable = "../../target/release/hello"
include = [
  "../../LICENSE=share/licenses/LICENSE",
  "../../target/release/THIRD-PARTY-LICENSES-hello=share/licenses/THIRD-PARTY-LICENSES",
]
