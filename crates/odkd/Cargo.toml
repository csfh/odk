[package]
name = "odkd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tells every ODK application what the host says: reduced motion, text size, font, colours (ADR 0062)"

[dependencies]
deps.workspace = true
# The portal client GPUI already brings, with the same features (ADR 0068), so a build of
# odkd alone reuses the workspace's; `wayland` is unused here.
ashpd = { version = "0.11", default-features = false, features = ["async-std", "wayland"] }
futures-lite = "2"
libc = "0.2"
odk-theme = { path = "../odk-theme" }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
# The fake portal of `tests/chooser.rs`, on the zbus `ashpd` already brings.
zbus = { version = "5", default-features = false, features = ["async-io"] }
