[package]
name = "oma"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runs, installs and sandboxes .oma Bundles"

[[bin]]
# The program behind `odk oma`, private and not on PATH (ADR 0056). The library keeps the name `oma`.
name = "odk-oma"
path = "src/main.rs"

[dependencies]
deps.workspace = true
clap = { version = "4", features = ["derive"] }
# Release keys in `oma-keys` are standard base64 (ADR 0060, section 3).
base64 = "0.22"
# Ed25519ctx for the signed documents of ADR 0060 (ADR 0061).
crrl = { version = "0.9.0", default-features = false, features = ["std", "ed25519"] }
# The publisher host in Unicode beside its punycode, in the consent dialog (ADR 0060, section 7).
idna = "1"
libc = "0.2"
# Sealing a Bundle file before it is trusted (ADR 0060, section 5).
rustix = { version = "1", features = ["fs", "process"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
# Digests and key ids of ADR 0060; the version crrl uses.
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
