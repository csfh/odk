[package]
name = "oma"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runs, installs and sandboxes .oma Bundles"

[dependencies]
deps.workspace = true
clap = { version = "4", features = ["derive"] }
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
