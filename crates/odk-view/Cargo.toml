[package]
name = "odk-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "ODK's interface on Rune: components, the host that follows the user's theme, and the window (ADR 0089, ADR 0094)"

[dependencies]
deps.workspace = true
odk-a11y.workspace = true
odk-theme.workspace = true
read-fonts = { version = "0.41", default-features = false, features = ["std"] }
rune.workspace = true

[dev-dependencies]
serde_json = "1"

# A table of what each component costs to build, with no harness crate (`benches/frame.rs`).
[[bench]]
name = "frame"
harness = false
