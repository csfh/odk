    "http",
    "httparse",
    "icu_locale_core",
    "icu_provider",
    "idna",
    "image",
    "indexmap",
    "libc",
    "linux-raw-sys",
    "linux-raw-sys_04",
    "litemap",
    "log",
    "memchr",
    "mio",
    "num-rational",
    "num-traits",
    "once_cell",
    "percent-encoding",
    "potential_utf",
    "proc-macro2",
    "profiling",
    "quote",
    "rand_core",
    "raw-window-handle",
    "read-fonts",
    "rgb",
    "rustix",
    "rustix_038",
    "rustls",
    "semver",
    "serde",
    "serde_core",
    "serde_json",
    "slab",
    "slotmap",
    "smallvec",
    "smol_str",
    "stable_deref_trait",
    "strict-num",
    "subtle",
    "swash",
    "syn",
    "syn_2",
    "tiny-skia",
    "tiny-skia-path",
    "tinystr",
    "toml_parser",
    "typenum",
    "unicode-ident",
    "uuid",
    "wayland-backend",
    "wayland-sys",
    "winnow",
    "writeable",
    "x11rb",
    "x11rb-protocol",
    "yoke",
    "zbus",
    "zbus_macros",
    "zbus_names",
    "zerocopy",
    "zerofrom",
    "zeroize",
    "zerotrie",
    "zerovec",
    "zvariant",
    "zvariant_derive",
    "zvariant_utils",
]
