[package]
name = "deps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Makes every build of one package resolve shared dependencies as the whole workspace does"

# Cargo unifies a dependency's features only across the packages in one build, so `cargo build
# -p hello` and `cargo build --workspace` can compile `libc` or `serde` with different features,
# and then everything above them, GPUI included, is compiled again. Every workspace member
# depends on this crate, and it asks for each such dependency with the features the whole
# workspace uses, so every selection agrees. `tools/check-deps` finds the list; run it
# after changing dependencies and copy what it prints here.

[dependencies]
libc = { version = "0.2", features = ["default", "extra_traits", "std"] }
linux-raw-sys = { version = "0.12", default-features = false, features = ["auxvec", "elf", "errno", "general", "if_ether", "ioctl", "net", "netlink", "no_std", "prctl", "system", "xdp"] }
log = { version = "0.4", default-features = false, features = ["kv_unstable_serde", "std"] }
mio = { version = "1", features = ["default", "log", "net", "os-ext", "os-poll"] }
once_cell = { version = "1", features = ["alloc", "default", "race", "std"] }
# Used only by build scripts or macros in some selections but at run time in a workspace build: a workspace build compiles it
# once with the normal profile and shares it, so every selection must have it as a normal dependency.
semver = { version = "1", features = ["default", "std"] }
unicode-ident = "1"
proc-macro2 = { version = "1", features = ["default", "proc-macro"] }
quote = { version = "1", features = ["default", "proc-macro"] }
syn = { version = "3", features = ["clone-impls", "default", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
rustix = { version = "1", features = ["default", "event", "fs", "net", "pipe", "process", "shm", "std", "system", "time"] }
serde = { version = "1", features = ["alloc", "default", "derive", "rc", "std"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "rc", "result", "std"] }
toml_parser = { version = "1", features = ["alloc", "default", "std"] }
winnow = { version = "1", features = ["alloc", "ascii", "binary", "default", "parser", "std"] }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
crossbeam-utils = { version = "0.8", features = ["default", "std"] }
event-listener = { version = "5", features = ["default", "parking", "std"] }
futures-core = { version = "0.3", features = ["alloc", "default", "std"] }
smallvec = { version = "1", features = ["const_generics", "const_new", "union", "write"] }
concurrent-queue = { version = "2", features = ["default", "std"] }
# Through crrl and sha2 in oma (ADR 0061). Two names are renamed, since other versions of
# getrandom and digest are in the tree as well.
rand_core = { version = "0.6", features = ["alloc", "getrandom", "std"] }
typenum = { version = "1", features = ["const-generics"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js", "rdrand", "std"] }
crypto-common = { version = "0.1", features = ["rand_core", "std"] }
digest_010 = { package = "digest", version = "0.10", features = ["alloc", "core-api", "mac", "std"] }
subtle = { version = "2", features = ["default", "i128", "std"] }
# Through url in GPUI, and in oma for the consent dialog's hosts (ADR 0060, section 7).
idna = { version = "1", features = ["alloc", "compiled_data", "default", "std"] }
event-listener-strategy = { version = "0.5", features = ["default", "std"] }
memchr = { version = "2", features = ["alloc", "default", "std"] }
# Through ashpd and zbus in odkd's file chooser (ADR 0068), as GPUI uses them.
equivalent = "1"
futures-channel = { version = "0.3", features = ["alloc", "default", "futures-sink", "sink", "std"] }
futures-sink = { version = "0.3", features = ["alloc", "default", "std"] }
form_urlencoded = { version = "1", features = ["alloc", "default", "std"] }
futures-util = { version = "0.3", features = ["alloc", "async-await", "async-await-macro", "channel", "default", "futures-channel", "futures-io", "futures-macro", "futures-sink", "io", "memchr", "sink", "slab", "std"] }
serde_json = { version = "1", features = ["alloc", "default", "indexmap", "preserve_order", "raw_value", "std"] }
uuid = { version = "1", features = ["default", "rng", "serde", "sha1", "std", "v4", "v5", "v7"] }
futures-io = { version = "0.3", features = ["default", "std"] }
indexmap = { version = "2", features = ["default", "serde", "std"] }
slab = { version = "0.4", features = ["default", "std"] }
zvariant = { version = "5", features = ["default", "enumflags2", "gvariant", "url"] }
zvariant_utils = { version = "4", features = ["default", "gvariant"] }
wayland-sys = { version = "0.31", features = ["client", "dlopen", "once_cell"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
# Macros in a build of odkd or the CLI alone, run-time crates in a workspace build.
zbus_macros = { version = "5", features = ["default", "gvariant"] }
zvariant_derive = { version = "5", features = ["default", "gvariant"] }
zbus_names = "4"
percent-encoding = { version = "2", features = ["alloc", "default", "std"] }
syn_2 = { package = "syn", version = "2", features = ["clone-impls", "default", "derive", "extra-traits", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
zerocopy = { version = "0.8", features = ["derive", "simd", "zerocopy-derive"] }

[build-dependencies]
# A member with no proc macros of its own, such as odk-a11y, otherwise builds these for its build
# scripts only, with a different profile from a workspace build.
quote = { version = "1", features = ["default", "proc-macro"] }
proc-macro2 = { version = "1", features = ["default", "proc-macro"] }
syn = { version = "3", features = ["clone-impls", "default", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
# Through zbus's and serde_repr's macros in odkd (ADR 0068).
syn_2 = { package = "syn", version = "2", features = ["clone-impls", "default", "derive", "extra-traits", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "rc", "result", "std"] }
serde = { version = "1", features = ["default", "derive", "rc", "std"] }
zvariant = { version = "5", features = ["default", "enumflags2", "gvariant"] }
zvariant_utils = { version = "4", features = ["default", "gvariant"] }
indexmap = { version = "2", features = ["default", "serde", "std"] }

# The dependencies above exist so the workspace resolves one feature set. This crate's
# Rust code does not name them, so cargo-machete would report each one. Add a new
# dependency here when it is added above.
[package.metadata.cargo-machete]
ignored = [
    "concurrent-queue",
    "crossbeam-utils",
    "crypto-common",
    "digest_010",
    "equivalent",
    "event-listener",
    "event-listener-strategy",
    "form_urlencoded",
    "futures-channel",
    "futures-core",
    "futures-io",
    "futures-sink",
    "futures-util",
    "getrandom_02",
    "hashbrown",
    "idna",
    "indexmap",
    "libc",
    "linux-raw-sys",
    "log",
    "memchr",
    "mio",
    "once_cell",
    "percent-encoding",
    "proc-macro2",
    "quote",
    "rand_core",
    "rustix",
    "semver",
    "serde",
    "serde_core",
    "serde_json",
    "slab",
    "smallvec",
    "subtle",
    "syn",
    "syn_2",
    "toml_parser",
    "typenum",
    "unicode-ident",
    "uuid",
    "wayland-backend",
    "wayland-sys",
    "winnow",
    "zbus_macros",
    "zbus_names",
    "zerocopy",
    "zvariant",
    "zvariant_derive",
    "zvariant_utils",
]
