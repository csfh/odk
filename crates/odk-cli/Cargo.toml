[package]
name = "odk-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The odk command: finds odk-<name> and runs it (ADR 0056)"

[lib]
name = "odk_cli"

[[bin]]
name = "odk"
path = "src/main.rs"
# The `odk` library of the same workspace has this documentation name.
doc = false

[dependencies]
deps.workspace = true

[dev-dependencies]
tempfile = "3"
