name: tests

on:
  pull_request:
  push:
    branches: [main]
  # A new RustSec advisory should fail `audit` even when nobody has opened a
  # pull request. The compile jobs skip this event.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # A newer pull request run replaces the one in progress. A push to main,
  # the Monday audit and a manual run are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: clippy, rustfmt
          user-namespaces: true
      # cargo fmt has no --locked; it does not read the lockfile.
      - run: cargo fmt --check
      # `--all-features` keeps `odk-db` in the lint and the tests: `odk::db` is behind
      # the `db` feature, which is off by default (ADR 0049).
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked --no-fail-fast
        env:
          # The 4 ms draw budget is for the development machine; a shared runner is slower.
          GALLERY_FRAME_BUDGET_MS: 12
          DRAW_BUDGET_MS: 30
      # ADR 0067: the kernel mounts what odk-oma's writer writes, behind the prefix. The runner
      # has root and a loop device; the development machine never mounts anything, and the test
      # does nothing unless it is root and ODK_KERNEL_MOUNT=1.
      - name: Load the kernel's EROFS
        run: sudo modprobe erofs
      - name: Mount the writer's image with the kernel, and show that the tmpfs test ran
        run: |
          bin=$(cargo test -p oma --lib --all-features --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "oma" and (.target.kind | index("lib"))) | .executable')
          "$bin" --exact sandbox::mounts::tests::a_launchs_app_is_the_images_tree_read_only_nosuid_and_nodev --nocapture
          sudo env ODK_KERNEL_MOUNT=1 "$bin" --ignored --exact image::tests::the_kernel_mounts_what_the_writer_writes --nocapture

  # Typechecks every target on the exact rust-version in the workspace manifest.
  msrv:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/rust-setup
        with:
          toolchain: msrv
      - name: Confirm the exact compiler
        run: |
          got=$(rustc --version)
          echo "$got"
          case "$got" in
            *" ${{ steps.setup.outputs.toolchain }} "*) ;;
            *)
              echo "::error::rustc is $got, wanted ${{ steps.setup.outputs.toolchain }}"
              exit 1
              ;;
          esac
      - run: cargo check --workspace --all-targets --all-features --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      # A vulnerability or a yanked crate fails the job. Unmaintained, unsound
      # and notice advisories stay warnings. An accepted advisory is an id in
      # .cargo/audit.toml. cargo-audit fetches the advisory database itself.
      - run: cargo-audit audit

  machete:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-machete
      - run: cargo-machete
