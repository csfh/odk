name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libvulkan-dev libasound2-dev
      - name: Allow user namespaces for the sandbox tests
        # Ubuntu 24.04 runners confine unprivileged user namespaces with AppArmor, which makes
        # oma's "making mounts private" fail.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
        env:
          # The 4 ms draw budget is for the development machine; a shared runner is slower.
          GALLERY_FRAME_BUDGET_MS: 12
          DRAW_BUDGET_MS: 30
