# cargo-audit reads this file, `.cargo/audit.toml`, from the directory it is
# run in. It uses `~/.cargo/audit.toml` only when this file is absent.
#
# The `audit` job is a required check and it reads the live RustSec database,
# so a newly published vulnerability fails `main` with no commit in the diff.
# The job also runs every Monday and on workflow_dispatch, so that failure
# shows up without waiting for a pull request.
#
# A vulnerability fails the job. A yanked crate fails it because `deny` below
# is `["yanked"]`; without that, cargo-audit only warns about a yank.
# Unmaintained, unsound and notice advisories stay warnings: `informational_warnings`
# is left unset (cargo-audit's default reports all three) and they are not in `deny`.
# The warnings in this tree come through the pinned GPUI (ADR 0029) and stay visible.
#
# `ignore` is a list of advisory ids. It can accept a vulnerability, or an
# informational advisory, until it can be fixed. It does not silence a yank:
# a yanked crate has no advisory id, so the fix is `cargo update -p`.
# cargo-audit stores the id only (the config rejects unknown fields), so a
# review date in the comment does not expire by itself. Remove the line when
# the review date arrives or a fix is in the lockfile. The list is empty.
#
#   ignore = [
#       # 2026-10-25: RUSTSEC-2026-0000, no fixed release; review by 2027-01-25.
#       "RUSTSEC-2026-0000",
#   ]

[advisories]
ignore = []

[output]
quiet = false
deny = ["yanked"]
