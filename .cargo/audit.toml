# cargo-audit reads this file, `.cargo/audit.toml`, from the directory it is
# run in. It uses `~/.cargo/audit.toml` only when this file is absent.
#
# The `audit` job is a required check and it reads the live RustSec database,
# so a newly published vulnerability fails `main` with no commit in the diff.
# The job also runs every Monday and on workflow_dispatch, so that failure
# shows up without waiting for a pull request.
#
# A vulnerability fails the job, and so does a yanked crate. Unmaintained,
# unsound and notice advisories are warnings: that is cargo-audit's default
# when `informational_warnings` is left unset, and this file leaves it unset.
# The `ignore` list is empty. The warnings in this tree come through the
# pinned GPUI (ADR 0029) and stay visible.
#
# To accept a vulnerability until it can be fixed, add its id under `ignore`
# with a comment on that line giving the reason and the date to look again.
# cargo-audit stores the id only (`ignore` is a list of strings, and the
# config rejects unknown fields), so the date does not expire by itself.
# Remove the line when the review date arrives or a fix is in the lockfile.
#
#   ignore = [
#       # 2026-10-25: RUSTSEC-2026-0000, no fixed release; review by 2027-01-25.
#       "RUSTSEC-2026-0000",
#   ]

[advisories]
ignore = []
