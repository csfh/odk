[package]
name = "stories"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# One bin per story, named here: a story is `stories/<name>.rs`, run with `tools/story <name>`.
autobins = false

[dependencies]
deps.workspace = true
odk.workspace = true

# The helpers every story uses (`section`, `row`, `narrow`).
[lib]
path = "lib.rs"

[[bin]]
name = "button"
path = "button.rs"

[[bin]]
name = "checkbox"
path = "checkbox.rs"

[[bin]]
name = "item_group"
path = "item_group.rs"

[[bin]]
name = "kbd"
path = "kbd.rs"

[[bin]]
name = "switch"
path = "switch.rs"

[[bin]]
name = "toggle_group"
path = "toggle_group.rs"
