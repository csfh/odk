[package]
name = "stories"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# One bin per story, named here: a story is `stories/<name>.rs`, run with `tools/story <name>`.
autobins = false

[dependencies]
deps.workspace = true
odk.workspace = true
# The Rune stories (ADR 0089): `stories/rune/`, run with `tools/story rune-NAME`.
odk-theme.workspace = true
odk-view.workspace = true
rune.workspace = true

# The helpers every story uses (`section`, `row`, `narrow`).
[lib]
path = "lib.rs"

[[bin]]
name = "button"
path = "button.rs"

[[bin]]
name = "checkbox"
path = "checkbox.rs"

[[bin]]
name = "item_group"
path = "item_group.rs"

[[bin]]
name = "kbd"
path = "kbd.rs"

[[bin]]
name = "switch"
path = "switch.rs"

[[bin]]
name = "toggle_group"
path = "toggle_group.rs"

[[bin]]
name = "rune-button"
path = "rune/button.rs"

[[bin]]
name = "rune-icon"
path = "rune/icon.rs"

[[bin]]
name = "rune-input"
path = "rune/input.rs"

[[bin]]
name = "rune-layout"
path = "rune/layout.rs"

[[bin]]
name = "rune-select"
path = "rune/select.rs"

[[bin]]
name = "rune-heading"
path = "rune/heading.rs"

[[bin]]
name = "rune-kbd"
path = "rune/kbd.rs"

[[bin]]
name = "rune-separator"
path = "rune/separator.rs"

[[bin]]
name = "rune-skeleton"
path = "rune/skeleton.rs"

[[bin]]
name = "rune-text"
path = "rune/text.rs"

[[bin]]
name = "rune-badge"
path = "rune/badge.rs"

[[bin]]
name = "rune-empty"
